# Workspace root. Not a package itself: it only ties the members together,
# declares the shared dev tools and holds the tool configuration.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "subeventually-core",
    "subeventually",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "hypothesis>=6.170.2",
]

[tool.uv.sources]
subeventually-core = { workspace = true }
subeventually = { workspace = true }

[tool.ruff]
line-length = 100
src = ["packages/core/src", "packages/tui/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/tui/tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
