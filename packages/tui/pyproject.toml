[project]
name = "subeventually"
version = "0.1.0.dev0"
description = "Terminal app for the subeventually cubing assistant"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "subeventually-core",
]

[project.scripts]
subeventually = "subeventually_tui.cli:main"

[tool.uv.sources]
subeventually-core = { workspace = true }

[tool.uv.build-backend]
module-name = "subeventually_tui"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
